<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#004d26" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#soft-shadow)" transform="translate(5, 5)">
    <!-- TOP-LEFT LEAF (Large, facing camera) -->
    <path d="M 74,72 C 70,55 52,26 34,32 C 16,38 12,65 30,78 C 44,88 64,77 74,72 Z" fill="#00693e"/>
    <!-- Top-Left Vein -->
    <line x1="34" y1="39" x2="70" y2="71" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>

    <!-- BOTTOM-LEFT LEAF (Large, facing camera) -->
    <path d="M 73,78 C 58,86 28,95 24,116 C 20,135 48,146 62,126 C 74,110 72,88 73,78 Z" fill="#00693e"/>
    <!-- Bottom-Left Vein -->
    <line x1="39" y1="122" x2="70" y2="82" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>

    <!-- TOP-RIGHT LEAF (Foreshortened in perspective, rotated inward) -->
    <path d="M 78,72 C 84,56 94,37 106,37 C 117,37 122,54 116,68 C 110,81 90,76 78,72 Z" fill="#00693e"/>
    <!-- Top-Right Vein -->
    <line x1="107" y1="45" x2="81" y2="71" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>

    <!-- BOTTOM-RIGHT LEAF (Foreshortened in perspective, rotated inward) -->
    <path d="M 78,78 C 88,86 112,98 116,112 C 120,125 106,134 94,124 C 84,114 80,90 78,78 Z" fill="#00693e"/>
    <!-- Bottom-Right Vein -->
    <line x1="105" y1="116" x2="81" y2="82" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
  </g>
</svg>